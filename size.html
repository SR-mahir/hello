<!DOCTYPE html>
<html lang ="en">
    <head>
        <title>Size</title>
        <!--padding(inside) is for text gap in div and margin(outside) is for window border and div section gap-->
        <style>                                     
            div{
                background-color: orangered;
                width: 500px;
                height: 400px;
                padding:20px;                       
                margin:20px;
            }                                       
        </style>
    </head>
    <body>
        <div>
            Hello, World!
        </div>
    </body>
</html>
