<!DOCTYPE html>
<html lang ="en">
    <head>
        <title>Attribute</title>
        <style>
        a{
            color:blueviolet;
        }
        a[href="https://www.google.com/"]{
            color:green;
        }
    </style>
    </head>
    <body>
        <ul>
            <li><a href="https://www.google.com/">Google</a></li>
            <li><a href="https://www.facebook.com/">Facebook</a></li>
            <li><a href="https://www.youtube.com/">YouTube</a></li>
        </ul>
    </body>
</html>
