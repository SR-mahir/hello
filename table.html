<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
        <style>
            table{
                border: 1px solid black;
                border-collapse: collapse;
            }
            td,th{
                border: 1px solid black;
                padding: 5px;
            }
        </style>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Cursed Technique</th>
                    <th>Domain Expantion</th>
                </tr>
                
            </thead>
            <tbody>
                <tr>
                    <td>Satoru Gojo</td>
                    <td>Limitless & Six Eyes</td>
                    <td>Unlimited Void</td>
                </tr>
                <tr>
                    <td>Sukuna</td>
                    <td>Shrine</td>
                    <td>Malevolent Shrine</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
